<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <!-- Main Light Slate Authentication Card -->
  <div class="auth-card p-5">
    <div class="auth-header text-center mb-4">
      <div class="tech-brand-logo mb-2 d-flex align-items-center justify-content-center gap-2">
        <img src="/logo.png" alt="PerfAnalyzer Logo" style="width: 44px; height: 44px; object-fit: contain;" />
      </div>
      <h1 class="tech-title">PerfAnalyzer</h1>
      <p class="text-primary fs-7 m-0 font-semibold letter-spacing-wide">SUPER ADMIN GATEWAY</p>
    </div>

    <!-- Alert Banners -->
    @if (errorMessage) {
    <div class="alert alert-danger-premium mb-4 d-flex align-items-center gap-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ errorMessage }}</span>
    </div>
    }
    @if (successMessage) {
    <div class="alert alert-success-premium mb-4 d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill"></i>
      <span>{{ successMessage }}</span>
    </div>
    }

    <!-- Login Form View -->
    <form (submit)="onSubmitLogin($event)" class="auth-form">
      <div class="form-group-premium mb-3">
        <label for="login-username" class="form-label-premium">ADMIN USERNAME</label>
        <div class="input-wrapper-premium">
          <i class="bi bi-person-badge"></i>
          <input type="text" id="login-username" name="username" [(ngModel)]="loginUsername"
            placeholder="Enter username" required autocomplete="off" />
        </div>
      </div>

      <div class="form-group-premium mb-4">
        <label for="login-password" class="form-label-premium">PASSWORD</label>
        <div class="input-wrapper-premium">
          <i class="bi bi-lock"></i>
          <input type="password" id="login-password" name="password" [(ngModel)]="loginPassword"
            placeholder="Enter password" required />
        </div>
      </div>

      <button type="submit" class="btn-auth-action py-3 w-100" [disabled]="isLoading">
        @if (isLoading) {
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        AUTHENTICATING...
        } @else {
        SIGN IN <i class="bi bi-shield-lock ms-2"></i>
        }
      </button>
    </form>
  </div>
</div>
