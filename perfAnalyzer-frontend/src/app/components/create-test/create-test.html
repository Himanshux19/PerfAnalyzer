<div class="reports-layout min-vh-100">
    <app-navbar></app-navbar>
    <div class="container-fluid py-4 px-lg-5">
        <div class="mb-4">
            <h2 class="font-bold">
                Create Test
            </h2>
            <p class="text-muted">
                Generate a JMeter (.jmx) test file
            </p>
        </div>
        <form [formGroup]="createTestForm" (ngSubmit)="generate()">
            <div class="card-premium p-4 mb-4">
                <h5 class="mb-4">
                    Test Information
                </h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Test Name
                        </label>
                        <input type="text" class="form-control" formControlName="testName">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            HTTP Method
                        </label>
                        <select class="form-select" formControlName="method">
                            @for(method of methods; track method){
                            <option [value]="method">
                                {{method}}
                            </option>
                            }
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">
                            Target URL
                        </label>
                        <input class="form-control" formControlName="url">
                    </div>
                </div>
            </div>
            <div class="card-premium p-4 mb-4">
                <h5 class="mb-4">
                    Load Configuration
                </h5>
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label">
                            Threads
                        </label>
                        <input class="form-control" type="number" formControlName="threads">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">
                            Ramp Up
                        </label>
                        <input class="form-control" type="number" formControlName="rampUp">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">
                            Duration
                        </label>
                        <input class="form-control" type="number" formControlName="duration">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">
                            Loop Count
                        </label>
                        <input class="form-control" type="number" formControlName="loopCount">
                    </div>
                </div>
            </div>
            @if(showBody()){
            <div class="card-premium p-4 mb-4">
                <h5 class="mb-4">
                    Request Body
                </h5>
                <textarea class="form-control" rows="10" formControlName="body">
                </textarea>
            </div>
            }
            <div class="text-end">
                <button class="btn btn-primary px-5" type="submit">
                    Generate JMX
                </button>
            </div>
        </form>
    </div>
</div>
